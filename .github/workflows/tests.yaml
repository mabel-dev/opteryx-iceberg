name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  # Lets release.yaml gate publishing on this exact suite, so the release
  # check can never drift from the one that runs on PRs.
  workflow_call:

# A newer push to the same branch makes the in-flight run irrelevant. Releases
# are keyed on the tag ref, so a release run is never cancelled by branch work.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Don't let one version failing hide the result on the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: deps
      run: |
        python -m pip install -U pip
        python -m pip install -e ".[test]"

    - name: test
      run: python -m pytest tests/ -v --durations=10

  # Tier 1 reads through a real Iceberg REST catalog over S3 - the wire path
  # the SqlCatalog tests above never cross. scripts/lakekeeper.sh starts the
  # stack (host network; see its header for why) and is the same script used
  # locally. LAKEKEEPER_REQUIRED makes the tests/test_lakekeeper_*.py modules
  # fail rather than skip if the stack's environment is missing.
  # tests/test_lakekeeper_queries.py's data and SQL (TPC-H, TPC-DS, ClickBench) are opteryx-core's
  # own (one home, there): only those paths of core main are checked out. The
  # engine itself is the PyPI opteryx-core `deps` installs.
  lakekeeper:
    name: lakekeeper REST catalog
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: checkout opteryx-core test data
      uses: actions/checkout@v4
      with:
        repository: mabel-dev/opteryx-core
        path: opteryx-core
        sparse-checkout: |
          testdata/planets
          testdata/satellites
          testdata/missions
          testdata/tpch_001
          testdata/tpcds_001
          testdata/clickbench_tiny
          tests/performance/tpch/opteryx/queries
          tests/performance/tpcds/opteryx/queries
          tests/performance/clickbench/opteryx

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip

    - name: deps
      run: |
        python -m pip install -U pip
        python -m pip install -e ".[test]"

    - name: load stack environment
      run: |
        cat scripts/lakekeeper.env >> "$GITHUB_ENV"
        echo "LAKEKEEPER_REQUIRED=1" >> "$GITHUB_ENV"
        echo "OPTERYX_CORE_ROOT=$GITHUB_WORKSPACE/opteryx-core" >> "$GITHUB_ENV"

    - name: start Lakekeeper
      run: scripts/lakekeeper.sh up

    - name: test
      run: python -m pytest tests/test_lakekeeper_*.py -v --durations=10

    - name: stack logs
      if: failure()
      run: scripts/lakekeeper.sh logs
