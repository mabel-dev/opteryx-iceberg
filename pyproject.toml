[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-iceberg"
version = "0.2.0"
description = "Apache Iceberg Metastore/FileIO backend for Opteryx: reads, CREATE TABLE and INSERT"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "joocer", email = "justin.joyce@joocer.com" }
]
license = { file = "LICENSE" }
keywords = ["opteryx", "iceberg", "catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
urls = { "Homepage" = "https://github.com/mabel-dev/opteryx-iceberg" }
requires-python = ">=3.11"
dependencies = [
    "opteryx-catalog>=0.4.196",
    "opteryx-core>=0.10.0",
    "pyiceberg==0.12.0rc1",
]

[project.optional-dependencies]
# Writing to S3 goes through opteryx-catalog's S3FileIO, which needs boto3.
s3 = [
    "opteryx-catalog[s3]>=0.4.196",
]
test = [
    "opteryx-iceberg[s3]",
    "pytest>=8",
    "pyiceberg[sql-sqlite,pyiceberg-core]==0.12.0rc1",
    "pyarrow",
    "fastavro",
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint.isort]
force-single-line = true
