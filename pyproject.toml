[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-iceberg"
version = "0.1.4"
description = "Read-only Apache Iceberg Metastore/FileIO backend for Opteryx"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "joocer", email = "justin.joyce@joocer.com" }
]
license = { file = "LICENSE" }
keywords = ["opteryx", "iceberg", "catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
urls = { "Homepage" = "https://github.com/mabel-dev/opteryx-iceberg" }
requires-python = ">=3.11"
dependencies = [
    "opteryx-catalog>=0.4.99",
    # IcebergFileIO (fileio.py) wraps pyiceberg's PyArrowFileIO unconditionally,
    # so pyarrow is a hard runtime dependency here, not optional - pyiceberg
    # itself only pulls it in behind the "pyarrow" extra.
    #
    # Pinned to the 0.12.0rc1 prerelease, not >=0.11,<1: 0.11.1 is the latest
    # STABLE release and it ships no cp314 wheel at all (checked PyPI's file
    # listing directly - cp310 through cp313 only), which breaks worker.opteryx
    # (Python 3.14, deliberately built with no Rust/C toolchain, so there's no
    # fallback to a source build). 0.12.0rc1 is the first release with a cp314
    # wheel. Move to a stable >=0.12 once one ships.
    "pyiceberg[pyarrow]==0.12.0rc1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # Only the test fixtures use pyiceberg's local SqlCatalog (SQLite +
    # local-disk FileIO, no server) - opteryx_iceberg's own code never
    # imports it, so this stays out of the main dependency list. Pinned to
    # match the main dependency - see the note above.
    "pyiceberg[sql-sqlite]==0.12.0rc1",
    # tests/test_end_to_end_sql.py runs real SQL through the engine rather than
    # stopping at the Metastore surface, so the engine itself is a test-only
    # dependency. opteryx_iceberg's own code never imports opteryx.
    "opteryx-core>=0.9.77",
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*"]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint.isort]
force-single-line = true
